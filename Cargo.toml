[workspace]
resolver = "2"
members = ["crates/audio2mp3-core", "crates/audio2mp3-jni"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = "s" # comparar con "z" y "3"; documentar el elegido
lto = true
codegen-units = 1
panic = "abort"
strip = true
