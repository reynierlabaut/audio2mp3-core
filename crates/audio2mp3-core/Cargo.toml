[package]
name = "audio2mp3-core"
description = "Encoder MP3 (MPEG-1 Layer III) pequeño y sin dependencias"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = []
ffi = []
pcm-convert = []

[dependencies]
# vacío: cero dependencias de runtime (spec §6)

[dev-dependencies]
# Decoder independiente para los tests de ida y vuelta; no entra en el binario.
symphonia = { version = "0.6.1", default-features = false, features = ["mp3"] }
