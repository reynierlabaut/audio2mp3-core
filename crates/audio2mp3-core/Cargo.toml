[package]
name = "audio2mp3-core"
description = "Small MP3 encoder (MPEG-1 Layer III, CBR) with zero dependencies and a C API"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["mp3", "audio", "encoder", "mpeg", "codec"]
categories = ["multimedia::audio", "multimedia::encoding"]

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = []
ffi = []
pcm-convert = []

[dependencies]
# vacío: cero dependencias de runtime (spec §6)

[dev-dependencies]
# Decoder independiente para los tests de ida y vuelta; no entra en el binario.
symphonia = { version = "0.6.1", default-features = false, features = ["mp3"] }
